<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwinFlow CRM — Lead Intake (TwinRover / OceanFallsEdge Widget Demo)</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #0f172a;
        background: #f1f5f9;
      }
      body {
        margin: 0;
        padding: 32px 16px;
      }
      .host-shell {
        max-width: 720px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      }
      .host-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid #e2e8f0;
      }
      .badge {
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: #ede9fe;
        color: #5b21b6;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 5px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font: inherit;
        font-size: 14px;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .full {
        grid-column: 1 / -1;
      }
      .log-box {
        margin-top: 20px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px;
        border-radius: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="host-shell">
      <div class="host-header">
        <div>
          <h1 style="margin: 0; font-size: 20px;">TwinFlow CRM — Lead Intake</h1>
          <div style="font-size: 13px; color: #64748b; margin-top: 3px;">
            Simulated third-party host page embedding TwinRover <code>widget.js</code> (<code>window.OceanFallsEdge</code>)
          </div>
        </div>
        <span class="badge" id="capture-mode-badge">Waiting for capture...</span>
      </div>

      <form id="lead-form" class="form-grid" onsubmit="event.preventDefault(); alert('Lead saved to TwinFlow CRM!');">
        <div>
          <label for="lead-name">Name</label>
          <input id="lead-name" name="name" placeholder="Jane Doe" />
        </div>
        <div>
          <label for="lead-company">Company</label>
          <input id="lead-company" name="company" placeholder="Acme Industrial Ltd." />
        </div>
        <div>
          <label for="lead-email">Email</label>
          <input id="lead-email" name="email" type="email" placeholder="jane@acme.example" />
        </div>
        <div>
          <label for="lead-phone">Phone</label>
          <input id="lead-phone" name="phone" placeholder="(604) 555-0199" />
        </div>
        <div class="full">
          <label for="lead-notes">Notes</label>
          <textarea id="lead-notes" name="notes" placeholder="Spoken field qualification notes & next steps..."></textarea>
        </div>
        <div class="full" style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="reset" style="padding: 10px 16px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">
            Clear Form
          </button>
          <button type="submit" style="padding: 10px 18px; border-radius: 10px; border: none; background: #6366f1; color: #fff; font-weight: 600; cursor: pointer;">
            Save Lead
          </button>
        </div>
      </form>

      <pre class="log-box" id="capture-log">// Tap the bottom-right "TwinRover AI" button to snap a business card or speak a lead note.</pre>
    </div>

    <script type="module" src="/src/embed.ts"></script>
    <script type="module">
      function bootWidget() {
        if (!window.OceanFallsEdge) {
          setTimeout(bootWidget, 50);
          return;
        }
        window.OceanFallsEdge.init({
          mount: 'floating',
          schemaUrl: 'schemas/twinflow-lead-intake.json',
          onCaptureComplete: ({ structuredData, transcript, mode, capturedAt }) => {
            const setVal = (id, val) => {
              if (val !== undefined && val !== null && String(val).trim() !== '') {
                document.getElementById(id).value = String(val);
              }
            };
            setVal('lead-name', structuredData.name || structuredData.primary_contact);
            setVal('lead-company', structuredData.company || structuredData.account_name);
            setVal('lead-email', structuredData.email);
            setVal('lead-phone', structuredData.phone);
            setVal(
              'lead-notes',
              structuredData.notes ||
                [structuredData.pain_point, structuredData.next_step, transcript]
                  .filter(Boolean)
                  .join(' — ')
            );

            document.getElementById('capture-mode-badge').textContent =
              `Populated via ${mode}`;
            document.getElementById('capture-log').textContent = JSON.stringify(
              { mode, capturedAt, transcript, structuredData },
              null,
              2
            );
          },
        });
      }
      bootWidget();
    </script>
  </body>
</html>
